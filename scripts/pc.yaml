toggle_on_off_pc_fix:
  alias: Toggle ON/OFF PC Fix
  description: ''
  sequence:
    - if:
        - condition: state
          entity_id: binary_sensor.pc_online
          state: 'off'
      then:
        - repeat:
            count: 3
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.alban_pc_fixe
              - delay: { seconds: 2 }
      else:
        - action: button.press
          target:
            entity_id: button.pc_shutdown