vacuum_clean_mop_all:
  alias: Vacuum — Clean & mop all rooms
  description: Sets fan to max and mop on, then cleans & mops the entire home.
  sequence:
    - action: vacuum.set_fan_speed
      target:
        entity_id: vacuum.roborock_qrevo_edge_series
      data:
        fan_speed: "max"
    - action: select.select_option
      target:
        entity_id: select.roborock_qrevo_edge_series_mop_intensity
      data:
        option: "custom_water_flow"
    - action: vacuum.send_command
      target:
        entity_id: vacuum.roborock_qrevo_edge_series
      data:
        command: app_segment_clean
        params:
          - segments:
              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
              - 7
            repeat: 1

