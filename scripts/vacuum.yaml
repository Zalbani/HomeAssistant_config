vacuum_stop:
  alias: Vacuum — Stop & return to base
  sequence:
    - action: vacuum.return_to_base
      target:
        entity_id: vacuum.roborock_qrevo_edge_series

vacuum_pause:
  alias: Vacuum — Pause
  sequence:
    - action: vacuum.pause
      target:
        entity_id: vacuum.roborock_qrevo_edge_series

vacuum_resume:
  alias: Vacuum — Resume
  sequence:
    - action: vacuum.start
      target:
        entity_id: vacuum.roborock_qrevo_edge_series

vacuum_clean_segment:
  alias: Vacuum — Clean segment
  description: Sets mop to off then vacuums the given segment. If room_id is provided, syncs the room selection booleans.
  fields:
    segment_id:
      description: Roborock segment ID
      example: 2
      selector:
        number:
          min: 1
          max: 100
    room_id:
      description: Optional — room ID matching input_boolean suffix (e.g. bathroom). If set, syncs room selection.
      example: bathroom
  sequence:
    - if:
        - condition: template
          value_template: "{{ room_id is defined and room_id != '' }}"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: !include ../mappings/vacuum/room_selects.yaml
        - action: input_boolean.turn_on
          target:
            entity_id: "input_boolean.vacuum_select_{{ room_id }}"
    - action: select.select_option
      target:
        entity_id: select.roborock_qrevo_edge_series_mop_intensity
      data:
        option: "off"
    - action: vacuum.send_command
      target:
        entity_id: vacuum.roborock_qrevo_edge_series
      data:
        command: app_segment_clean
        params:
          - segments:
              - "{{ segment_id | int }}"
            repeat: 1

vacuum_mop_segment:
  alias: Vacuum — Mop segment
  description: Sets fan to off and mop on, then mops the given segment. If room_id is provided, syncs the room selection booleans.
  fields:
    segment_id:
      description: Roborock segment ID
      example: 2
      selector:
        number:
          min: 1
          max: 100
    room_id:
      description: Optional — room ID matching input_boolean suffix (e.g. bathroom). If set, syncs room selection.
      example: bathroom
  sequence:
    - if:
        - condition: template
          value_template: "{{ room_id is defined and room_id != '' }}"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: !include ../mappings/vacuum/room_selects.yaml
        - action: input_boolean.turn_on
          target:
            entity_id: "input_boolean.vacuum_select_{{ room_id }}"
    - action: vacuum.set_fan_speed
      target:
