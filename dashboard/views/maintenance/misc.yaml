cards:
  - type: custom:bubble-card
    card_type: separator
    name: Lights
    icon: mdi:lightbulb

  - type: custom:mushroom-entity-card
    entity: input_boolean.sleep_mode
    name: Sleep mode
    icon: mdi:sleep
    tap_action:
      action: toggle

  - type: custom:mushroom-template-card
    primary: Resync bypass bulbs
    secondary: Bedroom · Living Room · Office
    icon: mdi:sync
    tap_action:
      action: perform-action
      perform_action: script.light_bypass_resync

  - type: custom:bubble-card
    card_type: separator
    name: Person
    icon: mdi:account

  - type: custom:mushroom-entity-card
    entity: person.alban_pierson
    fill_container: true

