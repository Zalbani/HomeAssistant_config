cards:
  - type: custom:bubble-card
    card_type: separator
    name: Roborock Qrevo Edge
    icon: mdi:robot-vacuum

  - type: custom:mushroom-entity-card
    entity: sensor.roborock_qrevo_edge_series_filter_time_left
    name: Filter
    icon: mdi:air-filter
    fill_container: true

  - type: custom:mushroom-entity-card
    entity: sensor.roborock_qrevo_edge_series_main_brush_time_left
    name: Main brush
    icon: mdi:brush
    fill_container: true

  - type: custom:mushroom-entity-card
    entity: sensor.roborock_qrevo_edge_series_side_brush_time_left
    name: Side brush
    icon: mdi:brush
    fill_container: true

  - type: custom:mushroom-entity-card
    entity: sensor.roborock_qrevo_edge_series_sensor_time_left
    name: Sensors
    icon: mdi:leak
    fill_container: true

  - type: custom:button-card
    template: vacuum_status_card
    styles:
      grid:
        - grid-template-areas: '"rooms" "divider" "header" "progress" "actions"'
        - grid-template-rows: auto 1px min-content min-content min-content
      custom_fields:
        rooms:
          - width: 100%
        divider:
          - width: 100%
          - height: 1px
          - background: rgba(255,255,255,0.08)
    custom_fields:
      divider: "<div></div>"
      rooms:
        card:
          type: grid
          columns: 3
          square: false
          cards:
            - type: custom:button-card
              template: vacuum_select_btn
              entity: input_boolean.vacuum_select_living_room
              name: Living Room
              icon: mdi:sofa-outline
            - type: custom:button-card
              template: vacuum_select_btn
              entity: input_boolean.vacuum_select_office
              name: Office
              icon: mdi:microsoft-office
            - type: custom:button-card
              template: vacuum_select_btn
              entity: input_boolean.vacuum_select_bedroom
              name: Bedroom
              icon: mdi:bed-outline
            - type: custom:button-card
              template: vacuum_select_btn
              entity: input_boolean.vacuum_select_kitchen
              name: Kitchen
              icon: mdi:coffee-maker-outline
            - type: custom:button-card
              template: vacuum_select_btn
              entity: input_boolean.vacuum_select_bathroom
              name: Bathroom
              icon: mdi:bathtub-outline
            - type: custom:button-card
              template: vacuum_select_btn
              entity: input_boolean.vacuum_select_restroom
              name: Restroom
              icon: mdi:paper-roll-outline
            - type: custom:button-card
              template: vacuum_select_btn
              entity: input_boolean.vacuum_select_entry
              name: Entry
              icon: mdi:door-open
