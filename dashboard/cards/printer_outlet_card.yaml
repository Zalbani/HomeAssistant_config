type: custom:button-card
entity: switch.office_3d_printer_outlet
show_name: false
show_icon: false
show_state: false
tap_action:
  action: perform-action
  perform_action: script.toggle_office_3d_printer_outlet
  haptic: light
hold_action:
  action: more-info
update_timer: 2
variables:
  s: |
    [[[
      const outletOn      = states['switch.office_3d_printer_outlet']?.state === 'on';
      const outletChanged = states['switch.office_3d_printer_outlet']?.last_changed;
      const scriptLast    = states['script.toggle_office_3d_printer_outlet']?.attributes?.last_triggered;
      const secsSince     = scriptLast ? (Date.now() - new Date(scriptLast).getTime()) / 1000 : Infinity;
      const transitioning = scriptLast && outletChanged && secsSince < 5
        && new Date(scriptLast) > new Date(outletChanged);
      const status        = states['sensor.bambu_farm_printer_print_status']?.state;
      const powerRaw      = states['sensor.office_3d_printer_outlet_instantaneous_demand']?.state;
      const power         = powerRaw && !['unavailable','unknown'].includes(powerRaw) ? parseFloat(powerRaw) : 0;
      const printing      = ['running', 'pause', 'prepare'].includes(status) || power > 15;
      const mode = transitioning
        ? (outletOn ? 'shutdown' : 'startup')
        : (outletOn ? 'online'   : 'offline');
      return { mode, printing };
    ]]]
extra_styles: |
  @keyframes printer-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1;    }
  }
  @keyframes printer-pulse-ring {
    0%   { transform: scale(0.85); opacity: 0.7; }
    100% { transform: scale(1.4);  opacity: 0;   }
  }
styles:
  card:
    - padding: 8px 12px
    - height: auto
  grid:
    - grid-template-areas: '"printer_icon info power_btn"'
    - grid-template-columns: min-content 1fr min-content
    - grid-template-rows: auto
    - align-items: center
    - column-gap: 10px
  custom_fields:
    printer_icon:
      - align-self: center
      - justify-self: center
    info:
      - align-self: center
      - justify-self: start
    power_btn:
      - align-self: center
      - justify-self: center
      - overflow: visible
custom_fields:
  printer_icon: |
    [[[
      const mode = variables.s.mode;
      const printing = variables.s.printing;
      let color;
      switch (mode) {
        case 'shutdown': color = '#E74C3C'; break;
        case 'startup':  color = '#FF9800'; break;
        case 'online':   color = printing ? '#FF9800' : '#2196F3'; break;
        default:         color = 'rgba(255,255,255,0.4)';
      }
      const anim = (printing && mode === 'online') ? 'animation: printer-pulse 1.6s ease-in-out infinite;' : '';
      return `<ha-icon icon="mdi:printer-3d" style="width:28px;height:28px;color:${color};${anim}"></ha-icon>`;
    ]]]
  info: |
    [[[
      const mode = variables.s.mode;
      const printing = variables.s.printing;
      const power   = states['sensor.office_3d_printer_outlet_instantaneous_demand']?.state;
      const energy  = states['sensor.office_3d_printer_outlet_summation_delivered']?.state;
      const cd      = states['sensor.office_3d_printer_auto_off_in']?.state;
      const armed   = states['sensor.office_3d_printer_auto_off_in']?.attributes?.armed === true;
      const powerNum  = power  && !['unavailable','unknown'].includes(power)  ? Math.round(parseFloat(power))   : null;
      const energyNum = energy && !['unavailable','unknown'].includes(energy) ? parseFloat(energy).toFixed(2)   : null;

      let subtitle, subColor = 'var(--primary-text-color)', subOpacity = 0.6;
      if (mode === 'shutdown') {
        subtitle = 'Powering off…';
        subColor = '#E74C3C'; subOpacity = 1;
      } else if (mode === 'startup') {
        subtitle = 'Powering on…';
        subColor = '#FF9800'; subOpacity = 1;
      } else if (mode === 'offline') {
        subtitle = energyNum != null ? `Off · ${energyNum} kWh total` : 'Off';
      } else if (printing) {
        subtitle = `Printing · ${powerNum ?? '—'} W`;
        subColor = '#FF9800'; subOpacity = 1;
      } else if (armed) {
        subtitle = `Auto-off in ${cd} · ${powerNum ?? '—'} W`;
        subColor = '#FF9800'; subOpacity = 1;
      } else {
        subtitle = `Idle · ${powerNum ?? '—'} W`;
      }
      return `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;">
        <span style="font-size:12px;font-weight:600;color:var(--primary-text-color);">3D Printer</span>
        <span style="font-size:11px;opacity:${subOpacity};color:${subColor};">${subtitle}</span>
      </div>`;
    ]]]
  power_btn: |
    [[[
      const mode = variables.s.mode;
      let rgb = null;
      switch (mode) {
        case 'shutdown': rgb = '231,76,60'; break;
        case 'startup':  rgb = '255,152,0'; break;
      }
      if (rgb) {
        return `<div style="position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:50%;background:rgba(${rgb},0.45);animation:printer-pulse-ring 1.4s ease-out infinite;"></div>
          <div style="position:relative;width:34px;height:34px;border-radius:50%;background:rgba(${rgb},0.2);display:flex;align-items:center;justify-content:center;animation:printer-pulse 1.4s ease-in-out infinite;">
            <ha-icon icon="mdi:power" style="width:18px;color:rgb(${rgb});"></ha-icon>
          </div>
        </div>`;
      }
      const isOn = mode === 'online';
      const color = isOn ? '#4CAF50' : 'rgba(255,255,255,0.3)';
      const bg    = isOn ? 'rgba(76,175,80,0.15)' : 'rgba(255,255,255,0.05)';
      return `<div style="width:34px;height:34px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;">
        <ha-icon icon="mdi:power" style="width:18px;color:${color};"></ha-icon>
      </div>`;
    ]]]
