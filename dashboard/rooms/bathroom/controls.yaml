cards:
  - type: custom:bubble-card
    card_type: separator
    name: Light
    icon: mdi:lightbulb

  - type: custom:mushroom-entity-card
    entity: switch.bathroom_ceiling_lamp_switch
    name: Ceiling light
    icon: mdi:ceiling-light-outline
    tap_action:
      action: toggle

  - type: custom:mushroom-entity-card
    entity: switch.bathroom_mirror_switch
    name: Mirror
    icon: mdi:mirror
    tap_action:
      action: toggle

  - type: custom:bubble-card
    card_type: separator
    name: Water leak
    icon: mdi:water-alert

  - type: custom:mushroom-entity-card
    entity: binary_sensor.bathroom_water_leak_sensor_water_leak
    name: Water leak
    icon: mdi:water-alert
    tap_action:
      action: more-info

  - type: custom:bubble-card
    card_type: separator
    name: Vacuum
    icon: mdi:robot-vacuum

  - type: custom:button-card
    template: vacuum_room_card
    variables:
      room_id: bathroom

  - type: custom:bubble-card
    card_type: separator
    name: Heating
    icon: mdi:radiator

  - type: thermostat
    entity: climate.bathroom_thermostatic_valve_thermostat

  - type: custom:bubble-card
    card_type: separator
    name: Thermometer
    icon: mdi:thermometer

  - type: custom:mushroom-entity-card
    entity: sensor.bathroom_thermometer_temperature
    name: Temperature
    icon: mdi:thermometer
    tap_action:
      action: more-info

  - type: custom:mushroom-entity-card
    entity: sensor.bathroom_thermometer_humidity
    name: Humidity
    icon: mdi:water-percent
    tap_action:
      action: more-info

  - type: history-graph
    entities:
      - entity: sensor.bathroom_thermometer_temperature
        name: Temperature
      - entity: sensor.bathroom_thermometer_humidity
        name: Humidity
    hours_to_show: 24

  - type: custom:bubble-card
    card_type: separator
    name: Scale
    icon: mdi:scale-bathroom

  - type: custom:mushroom-entity-card
    entity: sensor.scale_weight
    name: Weight
    icon: mdi:scale-bathroom
    tap_action:
      action: more-info

  - type: history-graph
    entities:
      - entity: sensor.scale_weight
        name: Weight
    hours_to_show: 720
    title: Weight (30 days)
