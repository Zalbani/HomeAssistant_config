cards:
  - type: custom:bubble-card
    card_type: separator
    name: Light
    icon: mdi:lightbulb

  - type: custom:mushroom-light-card
    entity: light.office_ceiling_lamp_bulb
    name: Ceiling light
    icon: mdi:ceiling-light-outline
    show_brightness_control: true
    collapsible_controls: false
    tap_action:
      action: perform-action
      perform_action: switch.toggle
      target:
        entity_id: switch.office_ceiling_lamp_switch

  - type: custom:bubble-card
    card_type: separator
    name: Covers
    icon: mdi:blinds

  - type: custom:mushroom-cover-card
    entity: cover.office_sunshade
    name: Sunshade
    icon: mdi:blinds
    show_buttons_control: true
    show_position_control: true
    collapsible_controls: false

  - type: custom:bubble-card
    card_type: separator
    name: Vacuum
    icon: mdi:robot-vacuum

  - type: custom:button-card
    template: vacuum_room_card
    variables:
      room_id: office

  - type: custom:bubble-card
    card_type: separator
    name: Heating
    icon: mdi:radiator

  - type: thermostat
    entity: climate.office_thermostatic_valve_thermostat

  - type: custom:bubble-card
    card_type: separator
    name: Devices
    icon: mdi:desktop-tower

  - !include ../../cards/pc_power_card.yaml

  - !include ../../cards/nas_card.yaml

  - type: custom:bubble-card
    card_type: separator
    name: 3D Printer
    icon: mdi:printer-3d

  - !include ../../cards/bambulab_card.yaml

  - type: custom:bubble-card
    card_type: separator
    name: Thermometer
    icon: mdi:thermometer

  - type: custom:mushroom-entity-card
    entity: sensor.office_thermometer_temperature
    name: Temperature
    icon: mdi:thermometer
    tap_action:
      action: more-info

  - type: custom:mushroom-entity-card
    entity: sensor.office_thermometer_humidity
    name: Humidity
    icon: mdi:water-percent
    tap_action:
      action: more-info

  - type: history-graph
    entities:
      - entity: sensor.office_thermometer_temperature
        name: Temperature
      - entity: sensor.office_thermometer_humidity
        name: Humidity
    hours_to_show: 24
