type: custom:button-card
template: room_card
name: Office
variables:
  name: Office
  room_id: office
  light_entity: light.office_ceiling_lamp_bulb
  sub_state: >
    [[[
      const temp = states['sensor.office_thermometer_temperature']?.state;
      if (temp && temp !== 'unknown') return `${parseFloat(temp).toFixed(1)}°`;
      return '';
    ]]]
  actions_columns:
    - - entity: light.office_ceiling_lamp_bulb
        icon: mdi:ceiling-light-outline
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - entity: cover.office_sunshade
        icon: mdi:blinds
      - entity: climate.office_thermostatic_valve_thermostat
        icon: mdi:fire
        tap_action:
          action: more-info
