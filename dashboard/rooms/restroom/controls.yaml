cards:
  - type: custom:bubble-card
    card_type: separator
    name: Light
    icon: mdi:lightbulb

  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: switch.restroom_ceiling_lamp_switch
    name: Ceiling light
    icon: mdi:ceiling-light-outline

  - type: custom:bubble-card
    card_type: separator
    name: Water leak
    icon: mdi:water-alert

  - type: custom:mushroom-entity-card
    entity: binary_sensor.restroom_water_leak_sensor_water_leak
    name: Water leak
    icon: mdi:water-alert
    tap_action:
      action: more-info

  - type: custom:bubble-card
    card_type: separator
    name: Vacuum
    icon: mdi:robot-vacuum

  - type: custom:button-card
    template: vacuum_room_card
    variables:
      room_id: restroom

