type: custom:button-card
template: room_card
name: Living Room
variables:
  name: Living Room
  room_id: living_room
  light_entity:
    - light.living_room_ceiling_lamp_bulb
    - switch.living_room_outlet_switch
    - switch.living_room_wall_outlet_switch_2
  sub_state: >
    [[[
      const temp = states['sensor.living_room_thermometer_temperature']?.state;
      if (temp && temp !== 'unknown') return `${parseFloat(temp).toFixed(1)}°`;
      return '';
    ]]]
  hvac_action: sensor.living_room_thermostatic_valve_hvac_action
  actions_columns:
    - - entity: light.living_room_ceiling_lamp_bulb
        icon: mdi:ceiling-light-outline
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - entity: switch.living_room_outlet_switch
        icon: mdi:floor-lamp-torchiere
        variables:
          rgb_entity: light.living_room_streetlight_bulb
        hold_action:
          action: more-info
          entity: light.living_room_streetlight_bulb
      - entity: light.living_room_mushroom_lamp_bulb
        icon: mdi:mushroom-outline
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - entity: switch.living_room_wall_outlet_switch_2
        icon: mdi:circle-double
        variables:
          fixed_color: "#FF9800"
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - entity: cover.living_room_shutter
        icon: mdi:window-shutter
    - - entity: cover.living_room_sunshade
        icon: mdi:blinds
      - entity: climate.living_room_thermostatic_valve_thermostat
        icon: mdi:fire
        tap_action:
          action: more-info
