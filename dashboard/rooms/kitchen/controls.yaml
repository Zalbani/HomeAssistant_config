cards:
  - type: custom:bubble-card
    card_type: separator
    name: Lights
    icon: mdi:lightbulb

  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: switch.kitchen_ceiling_lamp_switch
    name: Ceiling light
    icon: mdi:ceiling-light-outline


  - type: custom:bubble-card
    card_type: button
    entity: switch.kitchen_under_cabinet_lighting_switch
    name: Under cabinet
    icon: mdi:dome-light
    tap_action:
      action: toggle

  - type: custom:bubble-card
    card_type: separator
    name: Covers
    icon: mdi:window-shutter

  - type: custom:mushroom-cover-card
    entity: cover.kitchen_shutter
    name: Shutter
    icon: mdi:window-shutter
    show_buttons_control: true
    show_position_control: true
    collapsible_controls: false

  - type: custom:bubble-card
    card_type: separator
    name: Water leak
    icon: mdi:water-alert

  - type: custom:mushroom-entity-card
    entity: binary_sensor.kitchen_water_leak_sensor_water_leak
    name: Water leak
    icon: mdi:water-alert
    tap_action:
      action: more-info

  - type: custom:bubble-card
    card_type: separator
    name: Vacuum
    icon: mdi:robot-vacuum

  - type: custom:button-card
    template: vacuum_room_card
    variables:
      room_id: kitchen

