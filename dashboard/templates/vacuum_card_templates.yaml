        if (isPausePending || isResumePending) {
          const transitionLabel = isPausePending ? 'Pausing…' : 'Resuming…';
          return `
            <div style="background:rgba(255,255,255,0.12);border-radius:6px;height:12px;overflow:hidden;position:relative;">
              <div style="position:absolute;top:0;left:0;width:25%;height:100%;background:rgba(255,255,255,0.35);border-radius:6px;animation:vacuum-sweep 1.2s ease-in-out infinite;"></div>
            </div>
            <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.4);margin-top:5px;text-align:center;">${transitionLabel}</div>`;
        }
        const progress = Number(states['sensor.roborock_qrevo_edge_series_cleaning_progress']?.state || 0);
        return `
          <div style="background:rgba(255,255,255,0.12);border-radius:6px;height:12px;overflow:hidden;">
            <div style="width:${progress}%;background:#4CAF50;height:100%;border-radius:6px;transition:width 0.5s ease;"></div>
          </div>
          <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);margin-top:5px;text-align:center;">${progress}%</div>`;
      ]]]
    actions:
      card:
        type: horizontal-stack
        cards: |
          [[[
            const segId = variables.room_configs?.[variables.room_id]?.segment_id;
            const vacuum = 'vacuum.roborock_qrevo_edge_series';
            const status = states['sensor.roborock_qrevo_edge_series_status']?.state || '';
            const activeStates = ['cleaning','segment_cleaning','mopping','segment_mopping',
              'segment_clean_mop_cleaning','segment_clean_mop_mopping',
              'clean_mop_cleaning','clean_mop_mopping','robot_status_mopping',
              'segment_mopping','zoned_mopping','paused',
              'going_to_target','returning_home','docking',
              'washing_the_mop','going_to_wash_the_mop','back_to_dock_washing_duster'];
            const isActive = activeStates.includes(status);
            const _scripts = ['script.vacuum_clean_segment','script.vacuum_mop_segment','script.vacuum_clean_mop_segment','script.vacuum_clean_selected','script.vacuum_mop_selected','script.vacuum_clean_mop_selected'];
            const _lastTriggered = _scripts.reduce((max, s) => { const t = states[s]?.attributes?.last_triggered || ''; return t > max ? t : max; }, '');
            const _secsSince = _lastTriggered ? (Date.now() - new Date(_lastTriggered).getTime()) / 1000 : Infinity;
            const returningStates = ['returning_home','docking','washing_the_mop','going_to_wash_the_mop','back_to_dock_washing_duster'];
            const isReturning = returningStates.includes(status);
            const isPending = !isActive && !isReturning && _secsSince < 45;
            if (isReturning) return [];
            if (isPending) return [];
            const _pauseTriggered  = states['script.vacuum_pause']?.attributes?.last_triggered || '';
            const _resumeTriggered = states['script.vacuum_resume']?.attributes?.last_triggered || '';
            const isPausePending  = isActive && status !== 'paused' && (Date.now() - new Date(_pauseTriggered).getTime())  / 1000 < 8;
            const isResumePending = status === 'paused'             && (Date.now() - new Date(_resumeTriggered).getTime()) / 1000 < 8;
            const _stopTriggered  = states['script.vacuum_stop']?.attributes?.last_triggered || '';
            const isStopPending   = !isReturning && (isActive || status === 'paused') && (Date.now() - new Date(_stopTriggered).getTime()) / 1000 < 8;
            if (isStopPending || isPausePending || isResumePending) return [];
            if (isActive) {
              const isPaused = status === 'paused';
              return [
                {
                  type: 'custom:button-card',
                  template: 'vacuum_btn',
                  entity: vacuum,
                  icon: isPaused ? 'mdi:play' : 'mdi:pause',
                  name: isPaused ? 'Resume' : 'Pause',
                  tap_action: isPaused
                    ? { action: 'call-service', service: 'script.vacuum_resume', haptic: 'light' }
                    : { action: 'call-service', service: 'script.vacuum_pause',  haptic: 'light' },
                },
                {
                  type: 'custom:button-card',
                  template: 'vacuum_btn',
                  entity: vacuum,
                  icon: 'mdi:stop',
                  name: 'Stop',
                  tap_action: { action: 'call-service', service: 'script.vacuum_stop', haptic: 'medium' },
                },
              ];
            }
            const btn = (icon, name, service, data) => ({
              type: 'custom:button-card',
              template: 'vacuum_btn',
              entity: vacuum,
              icon,
              name,
              tap_action: { action: 'call-service', service, service_data: data, haptic: 'light' },
            });
            return [
              btn('mdi:vacuum',  'Vac',  'script.vacuum_clean_segment',    { segment_id: segId }),
              btn('mdi:water',   'Mop',  'script.vacuum_mop_segment',       { segment_id: segId }),
              btn('mdi:shimmer', 'Both', 'script.vacuum_clean_mop_segment', { segment_id: segId }),
            ];
          ]]]