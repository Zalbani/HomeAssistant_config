vacuum_btn:
  show_name: true
  show_icon: true
  show_state: false
  tap_action:
    action: none
    haptic: light
  styles:
    card:
      - flex: '1'
      - border-radius: 10px
      - padding: 8px 2px
      - background: rgba(255,255,255,0.06)
      - border: none
    icon:
      - width: 18px
      - color: rgba(255,255,255,0.75)
      - margin-bottom: 2px
    name:
      - font-size: 10px
      - opacity: 0.65

vacuum_select_btn:
  show_name: true
  show_icon: true
  show_state: false
  tap_action:
    action: toggle
    haptic: light
  styles:
    card:
      - border-radius: 12px
      - padding: 10px 4px
      - background: >
          [[[ return entity && entity.state === 'on' ? 'rgba(76,175,80,0.25)' : 'rgba(255,255,255,0.06)'; ]]]
      - border: >
          [[[ return entity && entity.state === 'on' ? '1px solid rgba(76,175,80,0.5)' : '1px solid rgba(255,255,255,0.06)'; ]]]
    icon:
      - width: 20px
      - color: >
          [[[ return entity && entity.state === 'on' ? '#4CAF50' : 'rgba(255,255,255,0.4)'; ]]]
      - margin-bottom: 3px
    name:
      - font-size: 10px
      - color: >
          [[[ return entity && entity.state === 'on' ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)'; ]]]

vacuum_status_card:
  entity: sensor.roborock_qrevo_edge_series_status
  show_name: false
  show_state: false
  show_icon: false
  tap_action:
    action: none
  update_timer: 2
  variables:
    vs: |
      [[[
        const status      = states['sensor.roborock_qrevo_edge_series_status']?.state || 'unknown';
        const error       = states['sensor.roborock_qrevo_edge_series_vacuum_error']?.state;
        const currentRoom = states['sensor.roborock_qrevo_edge_series_current_room']?.state || '';
        const progress    = Number(states['sensor.roborock_qrevo_edge_series_cleaning_progress']?.state || 0);
        const hasError    = error && error !== 'none';

        const activeStates = ['cleaning','segment_cleaning','mopping','segment_mopping',
          'segment_clean_mop_cleaning','segment_clean_mop_mopping',
          'clean_mop_cleaning','clean_mop_mopping','robot_status_mopping',
          'segment_mopping','zoned_mopping','paused',
          'going_to_target','returning_home','docking',
          'washing_the_mop','going_to_wash_the_mop','back_to_dock_washing_duster'];
        const cleaningStates = ['cleaning','segment_cleaning','mopping','segment_mopping',
          'segment_clean_mop_cleaning','segment_clean_mop_mopping',
          'clean_mop_cleaning','clean_mop_mopping','robot_status_mopping',
          'segment_mopping','zoned_mopping'];
        const returningStates = ['returning_home','docking','washing_the_mop','going_to_wash_the_mop','back_to_dock_washing_duster'];

        const isActive        = activeStates.includes(status);
        const isCleaning      = cleaningStates.includes(status);
        const isReturning     = returningStates.includes(status);
        const isPaused        = status === 'paused';
        const isGoingToTarget = status === 'going_to_target';

        const _last      = (s) => states[s]?.attributes?.last_triggered || '';
        const _maxLast   = (arr) => arr.reduce((m, s) => { const t = _last(s); return t > m ? t : m; }, '');
        const _sinceSecs = (s) => { const t = _last(s); return t ? (Date.now() - new Date(t).getTime()) / 1000 : Infinity; };

        const _starters = ['script.vacuum_clean_segment','script.vacuum_mop_segment','script.vacuum_clean_mop_segment',
          'script.vacuum_clean_selected','script.vacuum_mop_selected','script.vacuum_clean_mop_selected','script.vacuum_clean_mop_all'];
        const _lastStarter  = _maxLast(_starters);
        const _starterSince = _lastStarter ? (Date.now() - new Date(_lastStarter).getTime()) / 1000 : Infinity;
        const isPending     = !isActive && _starterSince < 45;

        const _lc = _maxLast(['script.vacuum_clean_segment','script.vacuum_clean_selected']);
        const _lm = _maxLast(['script.vacuum_mop_segment','script.vacuum_mop_selected']);
        const _lb = _maxLast(['script.vacuum_clean_mop_segment','script.vacuum_clean_mop_selected','script.vacuum_clean_mop_all']);
        const _mm = [_lc,_lm,_lb].reduce((a,b)=>b>a?b:a,'');
        const modeName = _mm ? (_mm === _lb ? 'Vac & Mop' : _mm === _lm ? 'Mop' : 'Vac') : '';

        const isPausePending  = isCleaning && !isPaused && _sinceSecs('script.vacuum_pause')  < 8;
        const isResumePending = isPaused              && _sinceSecs('script.vacuum_resume') < 8;
        const isStopPending   = !isReturning && (isCleaning || isPaused) && _sinceSecs('script.vacuum_stop') < 8;

        const ui = isStopPending   ? 'stopping'
          : isReturning            ? 'returning'
          : isPausePending         ? 'pausing'
          : isResumePending        ? 'resuming'
          : isPending              ? 'pending'
          : isCleaning             ? 'cleaning'
          : isPaused               ? 'paused'
          : isGoingToTarget        ? 'going_to_target'
          : 'idle';

        return { status, error, currentRoom, progress, hasError, isPaused, modeName, ui };
      ]]]
  extra_styles: |
    @keyframes vacuum-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  styles:
    card:
      - border-radius: 16px
      - padding: 12px
      - background: rgba(var(--rgb-card-background-color), 0.4)
      - border: 1px solid rgba(255, 255, 255, 0.08)
      - box-shadow: none
    grid:
      - grid-template-areas: '"header" "progress" "actions"'
      - grid-template-rows: min-content min-content min-content
      - gap: 8px
    custom_fields:
      header:
        - display: flex
        - align-items: center
        - justify-content: space-between
      progress:
        - width: 100%
        - display: block
        - box-sizing: border-box
  custom_fields:
    header: >
      [[[
        const v = variables.vs;
        const mainColor = v.hasError ? '#e74c3c' : 'rgba(255,255,255,0.85)';
        const mainIcon  = v.hasError ? 'mdi:robot-vacuum-alert' : 'mdi:robot-vacuum';
        let statusText, statusColor;
        if (v.hasError) {
          statusText  = v.error.replace(/_/g,' ');
          statusColor = '#e74c3c';
        } else {
          switch (v.ui) {
            case 'pending':
              statusText  = 'Starting…';
              statusColor = '#FF9800';
              break;
            case 'cleaning': {
              const _room = v.currentRoom || v.status.replace(/_/g,' ');
              statusText  = v.modeName ? v.modeName + (_room ? ' · ' + _room : '') : _room;
              statusColor = '#4CAF50';
              break;
            }
            default:
              statusText  = v.status.replace(/_/g,' ');
              statusColor = 'rgba(255,255,255,0.45)';
          }
        }
        return `
          <div style="display:flex;align-items:center;gap:6px;">
            <ha-icon icon="${mainIcon}" style="width:18px;color:${mainColor}"></ha-icon>
            <span style="font-size:14px;font-weight:600;color:${mainColor}">Vacuum</span>
          </div>
          <span style="font-size:12px;color:${statusColor}">${statusText}</span>`;
      ]]]
    progress: >
      [[[
        const v = variables.vs;
        const sweep = (color, label) => {
          let html = `<div style="background:rgba(255,255,255,0.12);border-radius:6px;height:12px;overflow:hidden;position:relative;">
              <div style="position:absolute;top:0;left:0;width:25%;height:100%;background:${color};border-radius:6px;animation:vacuum-sweep 1.2s ease-in-out infinite;"></div>
            </div>`;
          if (label) html += `<div style="font-size:12px;font-weight:600;color:${label.color};margin-top:5px;text-align:center;">${label.text}</div>`;
          return html;
        };
        switch (v.ui) {
          case 'pending':
            return sweep('rgba(255,152,0,0.7)', { text: '...',         color: 'rgba(255,152,0,0.8)' });
          case 'stopping':
            return sweep('rgba(231,76,60,0.7)', { text: 'Stopping…',   color: 'rgba(231,76,60,0.7)' });
          case 'returning':
            return sweep('rgba(231,76,60,0.7)');
          case 'pausing':
            return sweep('rgba(255,255,255,0.35)', { text: 'Pausing…', color: 'rgba(255,255,255,0.4)' });
          case 'resuming':
            return sweep('rgba(255,255,255,0.35)', { text: 'Resuming…', color: 'rgba(255,255,255,0.4)' });
          case 'cleaning':
          case 'paused':
          case 'going_to_target':
            return `
              <div style="background:rgba(255,255,255,0.12);border-radius:6px;height:12px;overflow:hidden;">
                <div style="width:${v.progress}%;background:#4CAF50;height:100%;border-radius:6px;transition:width 0.5s ease;"></div>
              </div>
              <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);margin-top:5px;text-align:center;">${v.progress}%</div>`;
          default:
            return '';
        }
      ]]]
    actions:
      card:
        type: horizontal-stack
        cards: |
          [[[
            const v = variables.vs;
            const vacuum = 'vacuum.roborock_qrevo_edge_series';
            switch (v.ui) {
              case 'pending':
              case 'stopping':
              case 'returning':
              case 'pausing':
              case 'resuming':
                return [];
              case 'cleaning':
              case 'paused':
              case 'going_to_target':
                return [
                  {
                    type: 'custom:button-card',
                    template: 'vacuum_btn',
                    entity: vacuum,
                    icon: v.isPaused ? 'mdi:play' : 'mdi:pause',
                    name: v.isPaused ? 'Resume' : 'Pause',
                    tap_action: v.isPaused
                      ? { action: 'call-service', service: 'script.vacuum_resume', haptic: 'light' }
                      : { action: 'call-service', service: 'script.vacuum_pause',  haptic: 'light' },
                  },
                  {
                    type: 'custom:button-card',
                    template: 'vacuum_btn',
                    entity: vacuum,
                    icon: 'mdi:stop',
                    name: 'Stop',
                    tap_action: { action: 'call-service', service: 'script.vacuum_stop', haptic: 'medium' },
                  },
                ];
              default: {
                const mkBtn = (icon, name, service) => ({
                  type: 'custom:button-card',
                  template: 'vacuum_btn',
                  entity: vacuum,
                  icon,
                  name,
                  tap_action: { action: 'call-service', service, haptic: 'light' },
                });
                return [
                  mkBtn('mdi:vacuum',  'Vac',  'script.vacuum_clean_selected'),
                  mkBtn('mdi:water',   'Mop',  'script.vacuum_mop_selected'),
                  mkBtn('mdi:shimmer', 'Both', 'script.vacuum_clean_mop_selected'),
                ];
              }
            }
          ]]]

vacuum_room_card:
  entity: sensor.roborock_qrevo_edge_series_status
  show_name: false
  show_state: false
  show_icon: false
  tap_action:
    action: none
  update_timer: 2
  variables:
    room_configs: !include ../rooms/config.yaml
    vs: |
      [[[
        const status      = states['sensor.roborock_qrevo_edge_series_status']?.state || 'unknown';
        const error       = states['sensor.roborock_qrevo_edge_series_vacuum_error']?.state;
        const currentRoom = states['sensor.roborock_qrevo_edge_series_current_room']?.state || '';
        const progress    = Number(states['sensor.roborock_qrevo_edge_series_cleaning_progress']?.state || 0);
        const hasError    = error && error !== 'none';
        const cfg         = variables.room_configs?.[variables.room_id] || {};
        const isThisRoom  = currentRoom === cfg.name;

        const activeStates = ['cleaning','segment_cleaning','mopping','segment_mopping',
          'segment_clean_mop_cleaning','segment_clean_mop_mopping',
          'clean_mop_cleaning','clean_mop_mopping','robot_status_mopping',
          'segment_mopping','zoned_mopping','paused',
          'going_to_target','returning_home','docking',
          'washing_the_mop','going_to_wash_the_mop','back_to_dock_washing_duster'];
        const cleaningStates = ['cleaning','segment_cleaning','mopping','segment_mopping',
          'segment_clean_mop_cleaning','segment_clean_mop_mopping',
          'clean_mop_cleaning','clean_mop_mopping','robot_status_mopping',
          'segment_mopping','zoned_mopping'];
        const returningStates = ['returning_home','docking','washing_the_mop','going_to_wash_the_mop','back_to_dock_washing_duster'];

        const isActive        = activeStates.includes(status);
        const isCleaning      = cleaningStates.includes(status);
        const isReturning     = returningStates.includes(status);
        const isPaused        = status === 'paused';
        const isGoingToTarget = status === 'going_to_target';

        const _last      = (s) => states[s]?.attributes?.last_triggered || '';
        const _maxLast   = (arr) => arr.reduce((m, s) => { const t = _last(s); return t > m ? t : m; }, '');
        const _sinceSecs = (s) => { const t = _last(s); return t ? (Date.now() - new Date(t).getTime()) / 1000 : Infinity; };

        const _starters = ['script.vacuum_clean_segment','script.vacuum_mop_segment','script.vacuum_clean_mop_segment',
          'script.vacuum_clean_selected','script.vacuum_mop_selected','script.vacuum_clean_mop_selected','script.vacuum_clean_mop_all'];
        const _lastStarter  = _maxLast(_starters);
        const _starterSince = _lastStarter ? (Date.now() - new Date(_lastStarter).getTime()) / 1000 : Infinity;
        const isPending     = !isActive && _starterSince < 45;

        const _lc = _maxLast(['script.vacuum_clean_segment','script.vacuum_clean_selected']);
        const _lm = _maxLast(['script.vacuum_mop_segment','script.vacuum_mop_selected']);
        const _lb = _maxLast(['script.vacuum_clean_mop_segment','script.vacuum_clean_mop_selected','script.vacuum_clean_mop_all']);
        const _mm = [_lc,_lm,_lb].reduce((a,b)=>b>a?b:a,'');
        const modeName = _mm ? (_mm === _lb ? 'Vac & Mop' : _mm === _lm ? 'Mop' : 'Vac') : '';

        const isPausePending  = isCleaning && !isPaused && _sinceSecs('script.vacuum_pause')  < 8;
        const isResumePending = isPaused              && _sinceSecs('script.vacuum_resume') < 8;
        const isStopPending   = !isReturning && (isCleaning || isPaused) && _sinceSecs('script.vacuum_stop') < 8;

        const ui = isStopPending   ? 'stopping'
          : isReturning            ? 'returning'
          : isPausePending         ? 'pausing'
          : isResumePending        ? 'resuming'
          : isPending              ? 'pending'
          : isCleaning             ? 'cleaning'
          : isPaused               ? 'paused'
          : isGoingToTarget        ? 'going_to_target'
          : 'idle';

        return { status, error, currentRoom, progress, hasError, isPaused, modeName, ui, cfg, isThisRoom };
      ]]]
  extra_styles: |
    @keyframes vacuum-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  styles:
    card:
      - border-radius: 16px
      - padding: 12px
      - background: rgba(var(--rgb-card-background-color), 0.4)
      - border: 1px solid rgba(255, 255, 255, 0.08)
      - box-shadow: none
    grid:
      - grid-template-areas: '"header" "progress" "actions"'
      - grid-template-rows: min-content min-content min-content
      - gap: 8px
    custom_fields:
      header:
        - display: flex
        - align-items: center
        - justify-content: space-between
      progress:
        - width: 100%
        - display: block
        - box-sizing: border-box
  custom_fields:
    header: >
      [[[
        const v = variables.vs;
        const mainColor = v.hasError ? '#e74c3c' : 'rgba(255,255,255,0.85)';
        const mainIcon  = v.hasError ? 'mdi:robot-vacuum-alert' : 'mdi:robot-vacuum';
        let statusText, statusColor;
        if (v.hasError) {
          statusText  = v.error.replace(/_/g,' ');
          statusColor = '#e74c3c';
        } else {
          switch (v.ui) {
            case 'pending':
              statusText  = 'Starting…';
              statusColor = '#FF9800';
              break;
            case 'cleaning':
              if (v.isThisRoom) {
                statusText  = v.modeName ? v.modeName + ' here…' : 'Cleaning here…';
                statusColor = '#4CAF50';
              } else {
                statusText  = v.modeName ? v.modeName + (v.currentRoom ? ' · ' + v.currentRoom : '') : (v.currentRoom || '');
                statusColor = '#FF9800';
              }
              break;
            default:
              statusText  = v.status.replace(/_/g,' ');
              statusColor = 'rgba(255,255,255,0.45)';
          }
        }
        return `
          <div style="display:flex;align-items:center;gap:6px;">
            <ha-icon icon="${mainIcon}" style="width:18px;color:${mainColor}"></ha-icon>
            <span style="font-size:14px;font-weight:600;color:${mainColor}">Vacuum</span>
          </div>
          <span style="font-size:12px;color:${statusColor}">${statusText}</span>`;
      ]]]
    progress: >
      [[[
        const v = variables.vs;
        const sweep = (color, label) => {
          let html = `<div style="background:rgba(255,255,255,0.12);border-radius:6px;height:12px;overflow:hidden;position:relative;">
              <div style="position:absolute;top:0;left:0;width:25%;height:100%;background:${color};border-radius:6px;animation:vacuum-sweep 1.2s ease-in-out infinite;"></div>
            </div>`;
          if (label) html += `<div style="font-size:12px;font-weight:600;color:${label.color};margin-top:5px;text-align:center;">${label.text}</div>`;
          return html;
        };
        switch (v.ui) {
          case 'pending':
            return sweep('rgba(255,152,0,0.7)', { text: '...',         color: 'rgba(255,152,0,0.8)' });
          case 'stopping':
            return sweep('rgba(231,76,60,0.7)', { text: 'Stopping…',   color: 'rgba(231,76,60,0.7)' });
          case 'returning':
            return sweep('rgba(231,76,60,0.7)');
          case 'pausing':
            return sweep('rgba(255,255,255,0.35)', { text: 'Pausing…', color: 'rgba(255,255,255,0.4)' });
          case 'resuming':
            return sweep('rgba(255,255,255,0.35)', { text: 'Resuming…', color: 'rgba(255,255,255,0.4)' });
          case 'cleaning':
          case 'paused':
          case 'going_to_target':
            return `
              <div style="background:rgba(255,255,255,0.12);border-radius:6px;height:12px;overflow:hidden;">
                <div style="width:${v.progress}%;background:#4CAF50;height:100%;border-radius:6px;transition:width 0.5s ease;"></div>
              </div>
              <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);margin-top:5px;text-align:center;">${v.progress}%</div>`;
          default:
            return '';
        }
      ]]]
    actions:
      card:
        type: horizontal-stack
        cards: |
          [[[
            const v = variables.vs;
            const vacuum = 'vacuum.roborock_qrevo_edge_series';
            switch (v.ui) {
              case 'pending':
              case 'stopping':
              case 'returning':
              case 'pausing':
              case 'resuming':
                return [];
              case 'cleaning':
              case 'paused':
              case 'going_to_target':
                return [
                  {
                    type: 'custom:button-card',
                    template: 'vacuum_btn',
                    entity: vacuum,
                    icon: v.isPaused ? 'mdi:play' : 'mdi:pause',
                    name: v.isPaused ? 'Resume' : 'Pause',
                    tap_action: v.isPaused
                      ? { action: 'call-service', service: 'script.vacuum_resume', haptic: 'light' }
                      : { action: 'call-service', service: 'script.vacuum_pause',  haptic: 'light' },
                  },
                  {
                    type: 'custom:button-card',
                    template: 'vacuum_btn',
                    entity: vacuum,
                    icon: 'mdi:stop',
                    name: 'Stop',
                    tap_action: { action: 'call-service', service: 'script.vacuum_stop', haptic: 'medium' },
                  },
                ];
              default: {
                const roomId = variables.room_id;
                const segId  = v.cfg.segment_id;
                const mkBtn = (icon, name, service) => ({
                  type: 'custom:button-card',
                  template: 'vacuum_btn',
                  entity: vacuum,
                  icon,
                  name,
                  tap_action: { action: 'call-service', service, service_data: { room_id: roomId, segment_id: segId }, haptic: 'light' },
                });
                return [
                  mkBtn('mdi:vacuum',  'Vac',  'script.vacuum_clean_segment'),
                  mkBtn('mdi:water',   'Mop',  'script.vacuum_mop_segment'),
                  mkBtn('mdi:shimmer', 'Both', 'script.vacuum_clean_mop_segment'),
                ];
              }
            }
          ]]]
