type: conditional
conditions:
  - condition: state
    entity: input_boolean.sleep_mode
    state: "on"
chip:
  type: template
  entity: input_boolean.sleep_mode
  icon: mdi:sleep
  icon_color: deep-purple
  content: Sleep
  tap_action:
    action: navigate
    navigation_path: /overview-dashboard/maintenance
  hold_action:
    action: toggle
