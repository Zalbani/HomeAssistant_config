type: conditional
conditions:
  - condition: state
    entity: sensor.bambu_farm_printer_print_status
    state: running
chip:
  type: template
  icon: mdi:printer-3d
  icon_color: green
  content: "{{ states('sensor.bambu_farm_printer_print_progress') }}%"
  tap_action:
    action: navigate
    navigation_path: /overview-dashboard/maintenance
