- platform: rest
  name: "Seerr"
  resource: "http://192.168.1.100:5055/api/v1/status"
  headers:
    X-Api-Key: !secret seerr_api_key
  scan_interval: 60
  value_template: "{{ value_json is defined }}"
  device_class: connectivity

