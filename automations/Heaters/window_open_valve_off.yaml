id: '1771400000001'
alias: Heaters - Window open cuts valve
description: >-
  When a window opens, turn off the associated radiator valve.
  When it closes, turn it back on and re-apply the active profile temperature.
  Windows without a `valve` field (e.g. kitchen) are silently ignored.
  Mapping in mappings/windows/by_sensor.yaml.
triggers:
  - alias: Window opened
    trigger: state
    entity_id: !include ../../mappings/windows/sensor_ids.yaml
    not_from:
      - unavailable
      - unknown
    to: 'on'
    id: opening
  - alias: Window closed
    trigger: state
    entity_id: !include ../../mappings/windows/sensor_ids.yaml
    not_from:
      - unavailable
      - unknown
    to: 'off'
    id: closing
variables:
  profiles: !include ../../mappings/heaters/profiles.yaml
  windows: !include ../../mappings/windows/by_sensor.yaml
  window: "{{ windows[trigger.entity_id] }}"
  valve_entity: "{{ window.get('valve') }}"
  room: "{{ window.get('room') }}"
  profile: "{{ states('input_select.heating_profile') }}"
conditions:
  - alias: Window has an associated radiator valve (silently skip e.g. kitchen)
    condition: template
    value_template: "{{ window.get('valve') is not none }}"
actions:
  - choose:
      - alias: "Window opened: disable valve"
        conditions:
          - condition: trigger
            id: opening
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ valve_entity }}"
      - alias: "Window closed: re-enable valve and restore temperature"
        conditions:
          - condition: trigger
            id: closing
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ valve_entity }}"
          - if:
              - condition: template
                value_template: "{{ room is not none }}"
            then:
              - delay: { seconds: 5 }
              - action: climate.set_temperature
                target:
                  entity_id: "{{ profiles.thermostats[room] }}"
                data:
                  temperature: "{{ profiles.temperatures[profile][room] }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ profiles.manual_overrides[room] }}"
mode: restart
