id: '1779568000001'
alias: Shutters - West Facade Sun Protection
description: >-
  Lowers bedroom/office/living-room sunshades fully and applies a 50% daylight
  tilt when the west facade is in direct sunlight (binary_sensor.west_facade_sun_exposure
  ON), and raises them back to 100% when shade returns. Skips any sunshade
  whose room window is open (re-armed via window_cover_control when it closes
  again). Skips closing entirely if wind protection is active.
  Window-to-cover mapping in mappings/windows/by_sensor.yaml
  (filter: close_during_west_sun=true).
triggers:
  - alias: West facade enters direct sun
    trigger: state
    entity_id: binary_sensor.west_facade_sun_exposure
    from: "off"
    to: "on"
    id: close
  - alias: West facade leaves direct sun
    trigger: state
    entity_id: binary_sensor.west_facade_sun_exposure
    from: "on"
    to: "off"
    id: open
variables:
  windows: !include ../../mappings/windows/by_sensor.yaml
actions:
  - choose:
      - conditions:
          - alias: West facade currently in direct sun
            condition: state
            entity_id: binary_sensor.west_facade_sun_exposure
            state: "on"
          - alias: Wind protection not active
            condition: state
            entity_id: input_boolean.wind_protection_active
            state: "off"
        sequence:
          - variables:
              covers_to_close: >-
                {% set ns = namespace(entities=[]) %}
                {% for sensor, w in windows.items() %}
                  {% if w.close_during_west_sun and not is_state(sensor, 'on') %}
                    {% set ns.entities = ns.entities + [w.cover] %}
                  {% endif %}
                {% endfor %}
                {{ ns.entities }}
          - alias: Lower sunshades fully
            action: cover.set_cover_position
            data:
              position: 0
            target:
              entity_id: "{{ covers_to_close }}"
          - alias: Apply daylight tilt
            action: cover.set_cover_tilt_position
            data:
              tilt_position: 50
            target:
              entity_id: "{{ covers_to_close }}"
      - conditions:
          - alias: West facade no longer in direct sun
            condition: state
            entity_id: binary_sensor.west_facade_sun_exposure
            state: "off"
        sequence:
          - variables:
              covers_to_reset: >-
                {% set ns = namespace(entities=[]) %}
                {% for sensor, w in windows.items() %}
                  {% if w.close_during_west_sun %}
                    {% set ns.entities = ns.entities + [w.cover] %}
                  {% endif %}
                {% endfor %}
                {{ ns.entities }}
          - action: cover.set_cover_position
            data:
              position: 100
            target:
              entity_id: "{{ covers_to_reset }}"
mode: single
