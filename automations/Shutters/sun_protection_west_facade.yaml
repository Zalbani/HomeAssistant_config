id: '1779568000001'
alias: Shutters - West Facade Sun Protection
description: >-
  Lowers bedroom/office/living-room sunshades fully and applies a 50% daylight
  tilt when the west facade is in direct sunlight (binary_sensor.west_facade_sun_exposure
  ON), and raises them back to 100% when shade returns. Skips living-room
  sunshade if the french window is open (re-armed via window_cover_control when
  it closes again). Skips bedroom sunshade on both close and open transitions
  when bedroom AC is active (keeps the BSO at whatever position the user set).
  Skips closing entirely if wind protection is active.
triggers:
  - alias: West facade enters direct sun
    trigger: state
    entity_id: binary_sensor.west_facade_sun_exposure
    from: "off"
    to: "on"
    id: close
  - alias: West facade leaves direct sun
    trigger: state
    entity_id: binary_sensor.west_facade_sun_exposure
    from: "on"
    to: "off"
    id: open
actions:
  - choose:
      - conditions:
          - alias: West facade currently in direct sun
            condition: state
            entity_id: binary_sensor.west_facade_sun_exposure
            state: "on"
          - alias: Wind protection not active
            condition: state
            entity_id: input_boolean.wind_protection_active
            state: "off"
        sequence:
          - variables:
              covers_to_close: >-
                {% set candidates = [
                     'cover.bedroom_sunshade',
                     'cover.office_sunshade',
                     'cover.living_room_sunshade'
                   ] %}
                {% set ns = namespace(items=[]) %}
                {% for c in candidates %}
                  {% if c == 'cover.living_room_sunshade'
                        and is_state('binary_sensor.living_room_french_window', 'on') %}
                  {% elif c == 'cover.bedroom_sunshade'
                        and is_state('input_boolean.bedroom_ac_active', 'on') %}
                  {% else %}
                    {% set ns.items = ns.items + [c] %}
                  {% endif %}
                {% endfor %}
                {{ ns.items }}
          - alias: Lower sunshades fully
            action: cover.set_cover_position
            data:
              position: 0
            target:
              entity_id: "{{ covers_to_close }}"
          - alias: Apply daylight tilt
            action: cover.set_cover_tilt_position
            data:
              tilt_position: 50
            target:
              entity_id: "{{ covers_to_close }}"
      - conditions:
          - alias: West facade no longer in direct sun
            condition: state
            entity_id: binary_sensor.west_facade_sun_exposure
            state: "off"
        sequence:
          - variables:
              covers_to_open: >-
                {% set candidates = [
                     'cover.bedroom_sunshade',
                     'cover.office_sunshade',
                     'cover.living_room_sunshade'
                   ] %}
                {% set ns = namespace(items=[]) %}
                {% for c in candidates %}
                  {% if c == 'cover.bedroom_sunshade'
                        and is_state('input_boolean.bedroom_ac_active', 'on') %}
                  {% else %}
                    {% set ns.items = ns.items + [c] %}
                  {% endif %}
                {% endfor %}
                {{ ns.items }}
          - action: cover.set_cover_position
            data:
              position: 100
            target:
              entity_id: "{{ covers_to_open }}"
mode: single
