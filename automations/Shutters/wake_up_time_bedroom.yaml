id: '1765722279017'
alias: Wake Up - Time - Bedroom
description: >-
  Opens bedroom shutter at sunrise +30 min on weekdays or 11:00 on weekends,
  only if the phone alarm is more than 5 hours away (avoids conflict with phone wake-up).
  Skipped entirely when bedroom AC is active.
triggers:
  - alias: Weekday - sunrise +30 min
    trigger: sun
    event: sunrise
    offset: "+00:30:00"
    id: weekday
  - alias: Weekend - 11:00
    trigger: time
    at: '11:00:00'
    id: weekend
conditions:
  - alias: Bedroom AC must be off
    condition: state
    entity_id: input_boolean.bedroom_ac_active
    state: "off"
  - alias: Match trigger to day type
    condition: or
    conditions:
      - alias: Weekday - sunrise trigger, alarm must be 5h+ away
        condition: and
        conditions:
          - condition: trigger
            id: weekday
          - condition: time
            weekday: [mon, tue, wed, thu, fri]
          - condition: template
            value_template: >-
              {{ states('sensor.pixel_9_pro_next_alarm') not in ['unknown', 'unavailable']
                 and now() <= (states('sensor.pixel_9_pro_next_alarm') | as_datetime - timedelta(hours=5)) }}
      - alias: Weekend - 11:00 trigger on Sat/Sun
        condition: and
        conditions:
          - condition: trigger
            id: weekend
          - condition: time
            weekday: [sat, sun]
actions:
  - alias: Stop any ongoing cover movement
    action: cover.stop_cover
    target:
      area_id:
        - bedroom
  - delay: { seconds: 1 }
  - alias: Open bedroom shutter
    action: cover.set_cover_position
    data:
      position: 100
    target:
      area_id:
        - bedroom
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.sleep_mode
mode: single
