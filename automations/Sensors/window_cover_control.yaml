id: '1771400000000'
alias: Sensors - Window to cover control
description: >-
  Raises the cover when a window opens (if currently closed).
  Closes it back when the window shuts during nighttime (if configured).
  Mapping in mappings/sensors/window_cover_mapping.yaml.
triggers:
  - alias: Window opened
    trigger: state
    entity_id: !include ../../mappings/sensors/window_sensors.yaml
    not_from:
      - unavailable
      - unknown
    to: 'on'
    id: opening
  - alias: Window closed
    trigger: state
    entity_id: !include ../../mappings/sensors/window_sensors.yaml
    not_from:
      - unavailable
      - unknown
    to: 'off'
    id: closing
variables:
  window_cover_mapping: !include ../../mappings/sensors/window_cover_mapping.yaml
  cover_config: "{{ window_cover_mapping[trigger.entity_id] }}"
  cover_entity: "{{ cover_config.cover }}"
  open_position: "{{ cover_config.open_position | default(70) }}"
  close_at_night: "{{ cover_config.get('close_at_night', false) }}"
  close_during_west_sun: "{{ cover_config.get('close_during_west_sun', false) }}"
actions:
  - choose:
      - alias: "Window opened: stop any ongoing movement then raise cover to open_position if currently below"
        conditions:
          - condition: trigger
            id: opening
        sequence:
          - alias: "Stop any cover movement in progress (interrupts a closing triggered just before, e.g. from a slam)"
            action: cover.stop_cover
            target:
              entity_id: "{{ cover_entity }}"
          - delay: { seconds: 1 }
          - alias: Raise cover to configured position if currently below
            if:
              - condition: template
                value_template: >
                  {{ state_attr(cover_entity, 'current_position') | int(100) < open_position }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ cover_entity }}"
                data:
                  position: "{{ open_position }}"
      - alias: "Window closed at night: lower cover"
        conditions:
          - condition: trigger
            id: closing
          - condition: template
            value_template: "{{ close_at_night }}"
          - condition: sun
            after: sunset
            after_offset: "+00:30:00"
            before: sunrise
        sequence:
          - alias: Close cover fully
            action: cover.set_cover_position
            target:
              entity_id: "{{ cover_entity }}"
            data:
              position: 0
      - alias: "Window closed during west sun: lower cover with daylight tilt"
        conditions:
          - condition: trigger
            id: closing
          - condition: template
            value_template: "{{ close_during_west_sun }}"
          - condition: state
            entity_id: binary_sensor.west_facade_sun_exposure
            state: "on"
        sequence:
          - alias: Lower cover fully
            action: cover.set_cover_position
            target:
              entity_id: "{{ cover_entity }}"
            data:
              position: 0
          - alias: Apply daylight tilt
            action: cover.set_cover_tilt_position
            target:
              entity_id: "{{ cover_entity }}"
            data:
              tilt_position: 50
mode: restart
