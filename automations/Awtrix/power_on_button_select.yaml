id: '1774836000015'
alias: Awtrix - Power On - Center Button
description: >-
  Turns on the Awtrix matrix when the center button is pressed while the display is off or dimmed to standby.
  Applies the current time-of-day brightness.
triggers:
  - trigger: state
    entity_id: binary_sensor.clock_awtrix_button_select
    to: "on"
conditions:
  - alias: Matrix is off or in standby dim
    condition: template
    value_template: >-
      {{ is_state('light.clock_awtrix_matrix', 'off')
         or (state_attr('light.clock_awtrix_matrix', 'brightness') | int(0)) <= 5 }}
actions:
  - action: script.awtrix_apply_time_brightness
mode: single
