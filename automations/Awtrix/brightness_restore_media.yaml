id: '1774836000004'
alias: Awtrix - Brightness Restore - Media Inactive
description: >-
  Restores the Awtrix matrix to the current time-of-day brightness when TV media
  becomes inactive (PS5, Plex, YouTube, and Twitch all inactive).
triggers:
  - alias: TV media becomes inactive
    trigger: state
    entity_id: binary_sensor.tv_media_active
    from: "on"
    to: "off"
conditions:
  - alias: Matrix is on
    condition: state
    entity_id: light.clock_awtrix_matrix
    state: "on"
  - alias: Not in sleep mode
    condition: state
    entity_id: input_boolean.sleep_mode
    state: "off"
  - alias: Someone is home
    condition: template
    value_template: >-
      {{ is_state('person.alban_pierson', 'home') or is_state('input_boolean.guest_mode', 'on') }}
actions:
  - action: script.awtrix_apply_time_brightness
mode: single
