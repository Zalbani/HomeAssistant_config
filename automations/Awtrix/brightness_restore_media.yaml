id: '1774836000004'
alias: Awtrix - Brightness Restore - Media Inactive
description: >-
  Restores the Awtrix matrix to the current time-of-day brightness when TV media
  becomes inactive (PS5, Plex, YouTube, and Twitch all inactive).
triggers:
  - alias: TV media becomes inactive
    trigger: state
    entity_id: binary_sensor.tv_media_active
    from: "on"
    to: "off"
actions:
  - action: script.awtrix_apply_time_brightness
mode: single
