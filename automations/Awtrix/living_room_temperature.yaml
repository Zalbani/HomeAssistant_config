id: '1773000000001'
alias: Awtrix - Living Room Temperature
description: >-
  Pushes the living room temperature to the Awtrix clock as a custom app.
  Refreshes every 5 min to stay permanently displayed. Clears the app if
  the sensor is unavailable.
triggers:
  - trigger: state
    entity_id: sensor.living_room_thermometer_temperature
  - trigger: time_pattern
    minutes: "/5"
  - trigger: homeassistant
    event: start
actions:
  - choose:
      - alias: Sensor unavailable — clear app
        conditions:
          - condition: state
            entity_id: sensor.living_room_thermometer_temperature
            state: unavailable
        sequence:
          - action: mqtt.publish
            data:
              topic: awtrix_6f0891c/custom/indoor_temp
              payload: ""
    default:
      - action: mqtt.publish
        data:
          topic: awtrix_6f0891c/custom/indoor_temp
          payload: >-
            {"text": "{{ states('sensor.living_room_thermometer_temperature') | round(1) }}", "icon": "2056"}
mode: single
