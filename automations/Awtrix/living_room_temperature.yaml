id: '1773000000001'
alias: Awtrix - Living Room Temperature
description: >-
  Pushes the living room temperature to the Awtrix clock as a custom app.
  Replaces the built-in temperature app — disable it in Awtrix device settings.
triggers:
  - trigger: state
    entity_id: sensor.living_room_thermometer_temperature
  - trigger: homeassistant
    event: start
actions:
  - action: mqtt.publish
    data:
      topic: awtrix_6f0891c/custom/indoor_temp
      payload: >-
        {"text": "{{ states('sensor.living_room_thermometer_temperature') | round(1) }}", "icon": "2056", "lifetime": 70}
mode: single
