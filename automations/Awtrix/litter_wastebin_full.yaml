id: '1779568000041'
alias: Awtrix - Litter Wastebin Full
description: >-
  Shows a notification on the Awtrix clock when the Petkit Pura MAX wastebin
  is full.
triggers:
  - trigger: state
    entity_id: binary_sensor.auto_litter_wastebin_filled
    to: 'on'
    for: "00:01:00"
actions:
  - action: mqtt.publish
    data:
      topic: awtrix/cmd/notify
      payload: >-
        {"text": "Wastebin full", "icon": "18576", "textColor": "#FF6B00", "durationMs": 30000}
mode: single
