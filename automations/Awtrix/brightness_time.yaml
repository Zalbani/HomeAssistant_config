id: '1774836000007'
alias: Awtrix - Brightness - Time of Day
description: >-
  Adjusts Awtrix brightness in steps based on the sun's progress through the day
  (0% = sunrise, 100% = sunset). Skipped when media is active on the TV to avoid
  overriding the media dim, and when
  in sleep mode or away to preserve the standby dim.
triggers:
  - trigger: sun
    event: sunrise
  - trigger: sun
    event: sunset
  - trigger: time_pattern
    minutes: "/30"
  - trigger: homeassistant
    event: start
conditions:
  - alias: Awtrix is on
    condition: state
    entity_id: light.clock_awtrix_matrix
    state: "on"
  - alias: No media active on TV
    condition: state
    entity_id: binary_sensor.tv_media_active
    state: "off"
  - alias: Not in sleep mode
    condition: state
    entity_id: input_boolean.sleep_mode
    state: "off"
  - alias: Someone is home
    condition: template
    value_template: >-
      {{ is_state('person.alban_pierson', 'home') or is_state('input_boolean.guest_mode', 'on') }}
actions:
  - action: script.awtrix_apply_time_brightness
mode: single
