id: '1774836000005'
alias: Awtrix - Dim - Away
description: >-
  Dims the Awtrix matrix to standby (1%) when leaving the apartment
  (never turns it off: it cannot be turned back on remotely).
  Skipped if guest mode is active.
triggers:
  - trigger: state
    entity_id: person.alban_pierson
    from: home
conditions:
  - alias: Skip if guests are present
    condition: state
    entity_id: input_boolean.guest_mode
    state: "off"
actions:
  - action: script.awtrix_dim
mode: single
