id: '1774836000009'
alias: Awtrix - Outdoor Weather
description: >-
  Pushes the outdoor temperature to the Awtrix clock with a dynamic icon based
  on the weather condition (mappings/awtrix/weather_icons.yaml) and a day
  progress bar. Refreshes every 10 min. Clears the app if unavailable.
triggers:
  - trigger: state
    entity_id: weather.forecast_home
  - trigger: time_pattern
    minutes: "/10"
  - trigger: homeassistant
    event: start
variables:
  weather_icons: !include ../../mappings/awtrix/weather_icons.yaml
actions:
  - choose:
      - alias: Weather unavailable — clear app
        conditions:
          - condition: state
            entity_id: weather.forecast_home
            state: unavailable
        sequence:
          - action: mqtt.publish
            data:
              topic: awtrix_6f0891c/custom/outdoor_weather
              payload: ""
    default:
      - action: mqtt.publish
        data:
          topic: awtrix_6f0891c/custom/outdoor_weather
          payload: >-
            {% set condition = states('weather.forecast_home') %}
            {% set icon = weather_icons.get(condition, '73') %}
            {% set now_ts = as_timestamp(now()) %}
            {% set next_rise = as_timestamp(state_attr('sun.sun', 'next_rising')) %}
            {% set next_set = as_timestamp(state_attr('sun.sun', 'next_setting')) %}
            {% if is_state('sun.sun', 'above_horizon') %}
              {% set today_rise = next_rise - 86400 %}
              {% set day_pct = ((now_ts - today_rise) / (next_set - today_rise) * 100) | round(0) | int %}
            {% else %}
              {% set day_pct = 0 %}
            {% endif %}
            {"text": "{{ state_attr('weather.forecast_home', 'temperature') | float(0) | round(0) | int }}°", "icon": "{{ icon }}", "progress": {{ day_pct }}, "progressC": "#FFB300"}
mode: single
