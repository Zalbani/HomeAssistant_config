id: '1774836000003'
alias: Awtrix - Power Off - Media Active
description: >-
  Turns off the Awtrix matrix when the TV media becomes active
  (PS5, Plex, YouTube, or Twitch on the TV).
triggers:
  - alias: TV media becomes active
    trigger: state
    entity_id: binary_sensor.tv_media_active
    from: "off"
    to: "on"
actions:
  - action: light.turn_off
    target:
      entity_id: light.clock_awtrix_matrix
mode: single
