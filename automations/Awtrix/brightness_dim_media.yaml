id: '1774836000003'
alias: Awtrix - Brightness Dim - Media Active
description: >-
  Dims the Awtrix matrix to 2% when the PS5 is on with the TV, or Plex is
  streaming on the living room TV (media_player.plex_plex_for_lg_lg_oled48c25lb).
triggers:
  - alias: PS5 active on TV or Plex streaming on TV
    trigger: template
    value_template: >-
      {{ (not is_state('media_player.playstation_5', ['off', 'standby', 'unavailable', 'unknown'])
          and not is_state('media_player.tv', 'off'))
         or is_state('media_player.plex_plex_for_lg_lg_oled48c25lb', ['playing', 'paused']) }}
actions:
  - action: light.turn_on
    target:
      entity_id: light.clock_awtrix_matrix
    data:
      brightness_pct: 2
mode: single
