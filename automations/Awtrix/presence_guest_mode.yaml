id: '1774836000008'
alias: Awtrix - Power - Guest Mode
description: >-
  Turns on the Awtrix when guest mode is enabled.
  Turns off Awtrix when guest mode is disabled and the owner is away.
triggers:
  - alias: Guest mode turned on
    trigger: state
    entity_id: input_boolean.guest_mode
    to: "on"
  - alias: Guest mode turned off
    trigger: state
    entity_id: input_boolean.guest_mode
    to: "off"
  - alias: HA started — restore Awtrix state based on guest mode
    trigger: homeassistant
    event: start
actions:
  - choose:
      - alias: Guest mode on — turn on Awtrix
        conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "on"
        sequence:
          - action: script.awtrix_apply_time_brightness
      - alias: Guest mode off — turn off Awtrix if owner away
        conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "off"
        sequence:
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: person.alban_pierson
                    state: home
            then:
              - action: light.turn_off
                target:
                  entity_id: light.clock_awtrix_matrix
mode: restart
