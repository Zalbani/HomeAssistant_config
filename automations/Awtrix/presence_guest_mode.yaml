id: '1774836000008'
alias: Awtrix - Power On - Guest Mode
description: >-
  Turns on the Awtrix when guest mode is enabled, or on HA start if guest mode
  is already on. Does not turn Awtrix off — that is handled by presence_off and
  power_off_lights_out.
triggers:
  - alias: Guest mode turned on
    trigger: state
    entity_id: input_boolean.guest_mode
    to: "on"
  - alias: HA started — turn on Awtrix if guest mode is on
    trigger: homeassistant
    event: start
conditions:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: "on"
actions:
  - action: script.awtrix_apply_time_brightness
mode: restart
