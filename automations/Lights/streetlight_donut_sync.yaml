id: '1771400000005'
alias: Lights - Streetlight ↔ Donut sync
description: >-
  Syncs the donut lamp when the streetlight is toggled.
  Skipped when the change originates from a UI/dashboard tap so each icon on
  the card keeps individual control; still fires for physical wall switch and
  remote/automation-driven toggles (context.user_id is None in those cases).
triggers:
  - trigger: state
    entity_id: switch.living_room_outlet_switch
    to: "on"
    id: turn_on
  - trigger: state
    entity_id: switch.living_room_outlet_switch
    to: "off"
    id: turn_off
conditions:
  - condition: template
    value_template: "{{ trigger.to_state.context.user_id is none }}"
actions:
  - if:
      - condition: trigger
        id: turn_on
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.living_room_wall_outlet_switch_2
    else:
      - action: switch.turn_off
        target:
          entity_id: switch.living_room_wall_outlet_switch_2
mode: single
