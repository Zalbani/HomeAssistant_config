id: '1772300000001'
alias: Sleep Mode - Detection ON
description: >-
  Turns on sleep mode helper when all sleep-relevant lights have been off for
  30 minutes, all shutters are closed and person is home.
  Light list in mappings/lights/sleep_relevant_lights.yaml.
trigger_variables:
  sleep_lights: !include ../../mappings/lights/sleep_relevant_lights.yaml
triggers:
  - trigger: template
    value_template: >-
      {{ expand(sleep_lights) | selectattr('state', 'eq', 'on') | list | count == 0 }}
    for: "00:30:00"
conditions:
  - condition: state
    entity_id: person.alban_pierson
    state: home
  - condition: template
    value_template: >-
      {{ states('cover.living_room_shutter') == 'closed'
         and states('cover.living_room_sunshade') == 'closed'
         and states('cover.office_sunshade') == 'closed'
         and states('cover.bedroom_sunshade') == 'closed'
         and states('cover.kitchen_shutter') == 'closed' }}
actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.sleep_mode
mode: single
