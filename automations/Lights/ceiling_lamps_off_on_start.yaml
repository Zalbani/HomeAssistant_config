id: '1771400000009'
alias: Light - Turn off ceiling lamps on HA start (daytime)
description: >-
  Turns off the living room, office and bedroom ceiling lamp bulbs after Home
  Assistant starts, only when the sun is above the horizon.
triggers:
  - trigger: homeassistant
    event: start
conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
variables:
  bulbs:
    - light.living_room_ceiling_lamp_bulb
    - light.office_ceiling_lamp_bulb
    - light.bedroom_ceiling_lamp_bulb
actions:
  - alias: Wait until ceiling lamp bulbs are available
    wait_template: >-
      {{ bulbs | map('states') | reject('in', ['unavailable', 'unknown']) | list | length == bulbs | length }}
    timeout: "00:05:00"
    continue_on_timeout: true
  # Matter devices report "available" before they can reliably accept commands.
  # Give the integration time to finish subscriptions before sending turn_off.
  - delay: "00:00:15"
  - repeat:
      for_each: "{{ bulbs }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ is_state(repeat.item, 'on') }}"
          then:
            - action: light.turn_off
              target:
                entity_id: "{{ repeat.item }}"
            # Re-issue once if the bulb didn't actually go off (Matter command lost).
            - delay: "00:00:05"
            - if:
                - condition: template
                  value_template: "{{ is_state(repeat.item, 'on') }}"
              then:
                - action: light.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
mode: single
