id: '1772000000007'
alias: Sensors - Toothbrush Battery Low
description: Sends a notification when the toothbrush battery drops below 10%.
triggers:
  - trigger: numeric_state
    entity_id: sensor.o_series_4_9d8a_battery
    below: 10
actions:
  - action: notify.mobile_app_pixel_9_pro
    data:
      title: "Toothbrush battery low"
      message: "Toothbrush battery is at {{ states('sensor.o_series_4_9d8a_battery') | int }}% — plug it in to charge."
mode: single
