id: '1746748800004'
alias: Arr Stack - Service Restored
description: >-
  Notifies when an Arr stack service comes back online after being down.
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.seerr
      - binary_sensor.prowlarr
      - binary_sensor.sonarr
      - binary_sensor.radarr
      - binary_sensor.bazarr
    from:
      - 'off'
      - 'unavailable'
    to: 'on'
actions:
  - action: notify.mobile_app_pixel_9_pro
    data:
      title: "Arr Stack — Service Restored"
      message: >-
        {{ trigger.to_state.attributes.friendly_name }} is back online
        (was down for {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | int }} min).
mode: parallel
max: 6
