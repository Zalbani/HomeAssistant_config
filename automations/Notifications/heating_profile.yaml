id: '1772000000002'
alias: Heating - Profile Change Notifier
description: >-
  Notifie lors d'un changement de profil de chauffage avec la raison déduite
  depuis la même chaîne de priorité que le resolver.
triggers:
  - trigger: state
    entity_id: input_select.heating_profile
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
variables:
  new_profile: "{{ trigger.to_state.state }}"
  old_profile: "{{ trigger.from_state.state }}"
  outdoor_temp: "{{ state_attr('weather.forecast_home', 'temperature') | float(0) }}"
  outdoor_threshold: "{{ states('input_number.heating_outdoor_threshold') | float(22) }}"
  is_night: >
    {{ now().hour >= 23
       or (now().hour < 12 and is_state('sun.sun', 'below_horizon')) }}
  profile_labels:
    comfort: "Confort"
    eco: "Eco"
    night: "Nuit"
    boost: "Boost"
    "off": "Eteint"
  reason: >
    {% if new_profile == 'boost' %}
      Activé manuellement
    {% elif old_profile == 'boost' %}
      Fin du boost —
      {%- if is_state('input_boolean.collective_heating', 'off') %}
        chauffage collectif éteint
      {%- elif is_state('person.alban_pierson', 'not_home') and is_state('input_boolean.guest_mode', 'off') %}
        absence détectée
      {%- elif outdoor_temp > outdoor_threshold %}
        température ext. {{ outdoor_temp }}°C > {{ outdoor_threshold }}°C
      {%- elif is_night %}
        heure nocturne
      {%- else %}
        retour au confort
      {%- endif %}
    {% elif new_profile == 'off' %}
      Chauffage collectif éteint
    {% elif is_state('person.alban_pierson', 'not_home') and is_state('input_boolean.guest_mode', 'off') %}
      Absence détectée
    {% elif outdoor_temp > outdoor_threshold %}
      Température ext. {{ outdoor_temp }}°C > {{ outdoor_threshold }}°C
    {% elif is_night %}
      Heure nocturne
    {% else %}
      Retour au confort
    {% endif %}
actions:
  - action: notify.mobile_app_pixel_9_pro
    data:
      title: "Chauffage : {{ profile_labels[new_profile] | default(new_profile) }}"
      message: "{{ reason | trim }}"
mode: queued
max: 5
