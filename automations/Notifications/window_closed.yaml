id: '1772000000002'
alias: Sensors - Window Closed After 30min
description: >-
  Sends a notification when a window is closed after being open for more than
  30 minutes. Covers all windows listed in mappings/windows/sensor_ids.yaml.
triggers:
  - trigger: state
    entity_id: !include ../../mappings/windows/sensor_ids.yaml
    from: 'on'
    to: 'off'
conditions:
  - condition: template
    value_template: >-
      {{ (now() - trigger.from_state.last_changed).total_seconds() >= 1800 }}
actions:
  - action: notify.phone
    data:
      title: "Window closed"
      message: >
        {{ trigger.to_state.attributes.friendly_name }} closed after
        {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | int }} minutes open.
  - action: mqtt.publish
    data:
      topic: awtrix_6f0891c/notify
      payload: >-
        {"text": "{{ trigger.to_state.attributes.friendly_name }} closed", "icon": "555", "color": "#4CAF50", "duration": 10}
mode: parallel
max: 5
