id: '1744600000001'
alias: Remotes - Entry - Button 1 - Leave Home
description: >
  Single/double/hold press = turn off all lights + Awtrix + shutdown PC if on.
  Sends a notification if the living room french window is open.
triggers:
  - trigger: state
    entity_id: event.entry_remote_button_1
    not_from:
      - unavailable
      - unknown
actions:
  - alias: Turn off all lights
    action: light.turn_off
    target:
      entity_id:
        - light.entry_telecontrol_switch
        - light.living_room_ceiling_lamp_bulb
        - light.living_room_streetlight_bulb
        - light.living_room_mushroom_lamp_bulb
        - light.office_ceiling_lamp_bulb
        - light.bedroom_ceiling_lamp_bulb
        - light.bedroom_bed_led_strip
  - alias: Turn off all light switches
    action: switch.turn_off
    target:
      entity_id:
        - switch.living_room_outlet_switch
        - switch.kitchen_ceiling_lamp_switch
        - switch.kitchen_under_cabinet_lighting_switch
        - switch.bathroom_ceiling_lamp_switch
        - switch.bathroom_mirror_switch
        - switch.restroom_ceiling_lamp_switch
        - switch.balcony_outside_lamp
  - alias: Turn off Awtrix
    action: light.turn_off
    target:
      entity_id: light.clock_awtrix_matrix
  - alias: Shutdown PC if on
    if:
      - condition: state
        entity_id: switch.alban_pc_fixe
        state: "on"
    then:
      - action: button.press
        target:
          entity_id: button.pc_shutdown
  - alias: Notify if french window is open
    if:
      - condition: state
        entity_id: binary_sensor.living_room_french_window
        state: "on"
    then:
      - action: notify.mobile_app_pixel_9_pro
        data:
          title: "Window open"
          message: "The living room french window is open."
mode: single
