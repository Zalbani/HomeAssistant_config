id: '1744600000001'
alias: Remotes - Entry - Button 1 - Leave Home
description: >
  Single/double/hold press = turn off all lights + Awtrix + shutdown PC if on.
  Sends a notification listing any window still open (mapping in
  mappings/windows/sensor_ids.yaml).
triggers:
  - trigger: state
    entity_id: event.entry_remote_button_1
    not_from:
      - unavailable
      - unknown
conditions:
  - alias: Event must be a fresh press (rejects state restoration on Matter restart)
    condition: template
    value_template: >-
      {{ trigger.to_state.state not in ['unavailable', 'unknown', 'none']
         and (now() - (trigger.to_state.state | as_datetime)) < timedelta(seconds=5) }}
variables:
  window_sensors: !include ../../mappings/windows/sensor_ids.yaml
actions:
  - alias: Turn off all lights
    action: light.turn_off
    target:
      entity_id:
        - light.entry_telecontrol_switch
        - light.living_room_ceiling_lamp_bulb
        - light.living_room_streetlight_bulb
        - light.living_room_mushroom_lamp_bulb
        - light.office_ceiling_lamp_bulb
        - light.bedroom_ceiling_lamp_bulb
        - light.bedroom_bed_led_strip
  - alias: Turn off all light switches
    action: switch.turn_off
    target:
      entity_id:
        - switch.living_room_outlet_switch
        - switch.kitchen_ceiling_lamp_switch
        - switch.kitchen_under_cabinet_lighting_switch
        - switch.bathroom_ceiling_lamp_switch
        - switch.bathroom_mirror_switch
        - switch.restroom_ceiling_lamp_switch
        - switch.balcony_outside_lamp
  - alias: Turn off Awtrix
    action: light.turn_off
    target:
      entity_id: light.clock_awtrix_matrix
  - alias: Shutdown PC if on
    if:
      - condition: state
        entity_id: switch.alban_pc_fixe
        state: "on"
    then:
      - action: button.press
        target:
          entity_id: button.pc_shutdown
  - alias: Notify if any window is open
    variables:
      open_windows: >-
        {{ window_sensors
           | select('is_state', 'on')
           | map('state_attr', 'friendly_name')
           | list }}
    if:
      - condition: template
        value_template: "{{ open_windows | length > 0 }}"
    then:
      - action: notify.phone
        data:
          title: "Window open"
          message: >-
            {%- if open_windows | length == 1 -%}
            {{ open_windows[0] }} is open.
            {%- else -%}
            {{ open_windows | length }} windows are open: {{ open_windows | join(', ') }}.
            {%- endif -%}
mode: single
