id: '1770911000003'
alias: Remotes - Global - Button 6 - Shutter toggle
description: Single press = toggle (stop if moving / close if any open / open if all closed). Double press = open all. Mapping in mappings/shutters/mapping.yaml
triggers:
  - trigger: state
    entity_id: !include ../../mappings/shutters/toggle_triggers.yaml
    not_from:
      - unavailable
      - unknown
conditions:
  - alias: Event must be a fresh press (rejects state restoration on Matter restart)
    condition: template
    value_template: >-
      {{ trigger.to_state.state not in ['unavailable', 'unknown', 'none']
         and (now() - (trigger.to_state.state | as_datetime)) < timedelta(seconds=5) }}
actions:
  - alias: Compute covers list and state
    variables:
      all_covers: "{{ mapping[trigger.entity_id].shutters + mapping[trigger.entity_id].sunshades }}"
      positions: "{{ all_covers | map('state_attr', 'current_position') | list }}"
      any_open: "{{ (positions | map('default', 0) | select('gt', 0) | list | length) > 0 }}"
      any_moving: "{{ (expand(all_covers) | selectattr('state', 'in', ['opening', 'closing']) | list | length) > 0 }}"
  - choose:
      - alias: Double press - open all (skip covers whose window is open)
        conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_2' }}"
        sequence:
          - variables:
              covers_to_open: >-
                {% set ns = namespace(entities=[]) %}
                {% for cover in all_covers %}
                  {% set sensor = cover_window_sensors.get(cover) %}
                  {% if not sensor or not is_state(sensor, 'on') %}
                    {% set ns.entities = ns.entities + [cover] %}
                  {% endif %}
                {% endfor %}
                {{ ns.entities }}
          - if:
              - condition: template
                value_template: "{{ covers_to_open | length > 0 }}"
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ covers_to_open }}"
                data:
                  position: 100
      - alias: Single press
        conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['single', 'single_click', 'multi_press_1'] }}"
        sequence:
          - choose:
              - alias: Any shutter moving - stop all
                conditions:
                  - condition: template
                    value_template: "{{ any_moving }}"
                sequence:
                  - action: cover.stop_cover
                    target:
                      entity_id: "{{ all_covers }}"
              - alias: At least one not closed - close all
                conditions:
                  - condition: template
                    value_template: "{{ any_open }}"
                sequence:
                  - variables:
                      covers_to_close: >-
                        {% if is_state('input_boolean.wind_protection_active', 'on') %}
                          {{ mapping[trigger.entity_id].shutters }}
                        {% else %}
                          {{ all_covers }}
                        {% endif %}
                  - if:
                      - condition: template
                        value_template: "{{ covers_to_close | length > 0 }}"
                    then:
                      - action: cover.set_cover_position
                        target:
                          entity_id: "{{ covers_to_close }}"
                        data:
                          position: 0
              - alias: All closed - open all
                conditions: []
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: "{{ all_covers }}"
                    data:
                      position: 100
mode: single
variables:
  mapping: !include ../../mappings/shutters/mapping.yaml
  cover_window_sensors: !include ../../mappings/shutters/cover_window_sensors.yaml
